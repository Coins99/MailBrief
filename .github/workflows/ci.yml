name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, type, and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.13

      - name: Synchronize dependencies
        run: uv sync --locked --all-groups

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src tests

      - name: Test
        run: uv run pytest

      - name: Qt tests on the Cocoa platform
        if: runner.os == 'macOS'
        env:
          MACOS_GUI_AVAILABLE: "1"
          QT_QPA_PLATFORM: cocoa
        run: uv run pytest --no-cov tests/ui tests/unit/test_app.py

      - name: Build desktop package
        run: uv run python scripts/build_desktop.py

      - name: Verify package startup and repeat launch offline
        run: uv run python scripts/check_package.py

      - name: Archive macOS app preserving permissions and symlinks
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent out/dist/MailBrief.app out/MailBrief-macOS.zip

      - name: Upload Windows package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: MailBrief-Windows
          path: out/dist/MailBrief/
          if-no-files-found: error
          retention-days: 7

      - name: Upload macOS package
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: MailBrief-macOS
          path: out/MailBrief-macOS.zip
          if-no-files-found: error
          retention-days: 7
