name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, type, and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    # Windows pull-request runs reached 25–29 minutes with the workspace UI tests; the follow-up PR speeds them up.
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Exclude CI folders from Defender
        if: runner.os == 'Windows'
        # Real-time scanning of every file uv unpacks and every test database slows Windows runs.
        continue-on-error: true
        shell: pwsh
        run: Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:TEMP, "$env:LOCALAPPDATA\uv"

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.13

      - name: Synchronize dependencies
        run: uv sync --locked --all-groups

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src tests

      # CI runs on both sides of UTC so time-zone bugs show up: macOS in Toronto, Windows in Tokyo.
      # TZ goes through GITHUB_ENV on macOS only: a job-wide TZ would reach Windows too.
      - name: Use Toronto time on macOS
        if: runner.os == 'macOS'
        run: echo "TZ=America/Toronto" >> "$GITHUB_ENV"

      - name: Use Tokyo time on Windows
        if: runner.os == 'Windows'
        run: |
          tzutil /s "Tokyo Standard Time"
          tzutil /g

      - name: Test
        # macOS runs its Qt tests in the next step, so its coverage gate waits for them.
        run: uv run pytest -n auto --durations=30 ${{ runner.os == 'macOS' && '--cov-fail-under=0' || '' }}

      - name: Qt tests on the Cocoa platform
        if: runner.os == 'macOS'
        env:
          MACOS_GUI_AVAILABLE: "1"
          QT_QPA_PLATFORM: cocoa
        # Adds these tests' coverage to the main run's; the 80% gate applies to the total.
        # Serial: the keyboard tests need one active window at a time.
        run: uv run pytest --cov-append --durations=30 tests/ui tests/unit/test_app.py

      - name: Verify required service coverage
        run: uv run python scripts/check_coverage.py

      - name: Build desktop package
        run: uv run python scripts/build_desktop.py

      - name: Verify package startup and repeat launch offline
        run: uv run python scripts/check_package.py

      - name: Archive macOS app preserving permissions and symlinks
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent out/dist/MailBrief.app out/MailBrief-macOS.zip

      - name: Upload Windows package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: MailBrief-Windows
          path: out/dist/MailBrief/
          if-no-files-found: error
          retention-days: 7

      - name: Upload macOS package
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: MailBrief-macOS
          path: out/MailBrief-macOS.zip
          if-no-files-found: error
          retention-days: 7
