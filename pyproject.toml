[project]
name = "mailbrief"
version = "0.1.0"
description = "A desktop app that creates daily highlights of important emails, actions, and deadlines"
readme = "README.md"
authors = [
    { name = "Junran Zhou", email = "j544zhou@uwaterloo.ca" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiosqlite>=0.22.1,<1",
    "alembic>=1.19.1,<2",
    "httpx>=0.28.1,<0.29",
    "keyring>=25.7,<26",
    "msal>=1.38,<2",
    "msal-extensions[portalocker]>=1.3.1,<2",
    "openai>=3.6,<4",
    "pydantic>=2.13.5,<3",
    "pydantic-settings>=2.15,<3",
    "pyside6>=6.11.2,<6.12",
    "qasync>=0.28,<0.29",
    "sqlalchemy[asyncio]>=2.0.52,<2.1",
]

[project.scripts]
mailbrief = "mailbrief.app:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pyinstaller>=6.22.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-qt>=4.5.0",
    "respx>=0.23.1",
    "ruff>=0.16.5",
    "time-machine>=3.5.0",
]

[tool.uv]
required-version = ">=0.12.7,<0.13"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["ASYNC", "B", "C4", "E", "F", "I", "SIM", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["mailbrief"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--cov=mailbrief",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=80",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
qt_api = "pyside6"
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["mailbrief"]
omit = ["src/mailbrief/__main__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
